name: Deploy

on:
  push:
    branches: [main]

# Required for GitHub's OIDC token to be issued to this workflow run.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::263043884074:role/github-actions-deploy-portfolio
          aws-region: us-east-1

      - name: Sync build output to S3
        run: aws s3 sync dist/ s3://justinpenny.com --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3LQJOEGZ9JLT --paths "/*"
